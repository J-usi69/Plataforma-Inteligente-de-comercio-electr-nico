services:
  # Postgres LOCAL: sandbox opcional y aislado, NO se usa por defecto.
  # El backend se conecta directo a Supabase (via .env, ver servicio "backend").
  # Levantarlo solo si necesitas probar algo destructivo sin tocar la BD compartida:
  #   docker compose --profile local-db up -d postgres
  postgres:
    image: postgres:16
    container_name: fashionstore-postgres
    restart: unless-stopped
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fashionstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fashionstore}
      POSTGRES_DB: ${POSTGRES_DB:-fashionstore}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/init-seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fashionstore} -d ${POSTGRES_DB:-fashionstore}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fashionstore-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fashionstore-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./.env
    networks:
      - fashionstore-network

  frontend:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    container_name: fashionstore-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    environment:
      BACKEND_UPSTREAM: http://backend:8000
      BACKEND_HOST: backend:8000
    depends_on:
      - backend
    networks:
      - fashionstore-network

networks:
  fashionstore-network:
    driver: bridge

volumes:
  postgres_data:
